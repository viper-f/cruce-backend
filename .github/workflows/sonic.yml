name: Install Sonic

on:
  workflow_dispatch:

jobs:
  install-sonic:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust and build Sonic
        run: |
          sudo apt-get install -y build-essential git
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          git clone --depth 1 https://github.com/valeriansaliou/sonic.git
          cd sonic
          cargo build --release

      - name: Copy Sonic binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "sonic/target/release/sonic"
          target: "/usr/local/bin/"
          strip_components: 3

      - name: Configure Sonic and start service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod 755 /usr/local/bin/sonic
            id -u sonic &>/dev/null || useradd --system --no-create-home --shell /usr/sbin/nologin sonic
            mkdir -p /var/lib/sonic/store/kv /var/lib/sonic/store/fst
            chown -R sonic:sonic /var/lib/sonic

            cat > /etc/sonic.cfg << 'SONICEOF'
            [server]
            log_level = "error"

            [channel]
            inet = "0.0.0.0:1491"
            tcp_timeout = 300
            auth_password = "SecretPassword"

            [channel.search]
            query_limit_default = 10
            query_limit_maximum = 100
            query_alternates_try = 4
            suggest_limit_default = 5
            suggest_limit_maximum = 20
            list_limit_default = 100
            list_limit_maximum = 500

            [store]

            [store.kv]
            path = "/var/lib/sonic/store/kv/"
            retain_word_objects = 1000

            [store.kv.pool]
            inactive_after = 1800

            [store.kv.database]
            flush_after = 900
            compress = true
            parallelism = 2
            max_files = 100
            max_compactions = 1
            max_flushes = 1
            write_buffer = 16384
            write_ahead_log = true

            [store.fst]
            path = "/var/lib/sonic/store/fst/"

            [store.fst.pool]
            inactive_after = 300

            [store.fst.graph]
            consolidate_after = 180
            max_size = 2048
            max_words = 250000
            SONICEOF

            cat > /etc/systemd/system/sonic.service << 'SVCEOF'
            [Unit]
            Description=Sonic Search Index
            After=network.target

            [Service]
            Type=simple
            User=sonic
            ExecStart=/usr/local/bin/sonic -c /etc/sonic.cfg
            Restart=on-failure
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            systemctl daemon-reload
            systemctl enable sonic
            systemctl restart sonic
